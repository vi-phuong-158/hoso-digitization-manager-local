<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hồ sơ Số — Quản lý số hóa Đảng vụ{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238c1119'/%3E%3Cpolygon points='16,6 18.8,12.5 25.8,13.1 20.5,17.7 22.1,24.6 16,21 9.9,24.6 11.5,17.7 6.2,13.1 13.2,12.5' fill='%23e8b83e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/manager.css">
</head>
<body>
  <div class="app-shell">
    <header class="floating-header">
      <a href="/" class="brand" aria-label="Trang chủ Hồ sơ Đảng viên">
        <div class="brand-emblem" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26" />
          </svg>
        </div>
        <div class="brand-titles">
          <span class="brand-title">HỒ SƠ ĐẢNG VIÊN</span>
          <span class="brand-subtitle">Quản lý số hóa nội bộ</span>
        </div>
      </a>

      <nav class="nav-links" aria-label="Điều hướng chính">
        <a href="/" class="nav-link" data-nav="dashboard">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          <span>Tổng quan</span>
        </a>
        <a href="/cases" class="nav-link" data-nav="cases">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <span>Hồ sơ</span>
        </a>
        <a href="/add-document" class="nav-link" data-nav="add-document">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          <span>Thêm tài liệu</span>
        </a>
        <a href="/scan" class="nav-link" data-nav="scan">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
          <span>Scan / AI</span>
        </a>
        <a href="/reviews" class="nav-link" data-nav="reviews">
          <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span>Rà soát</span>
        </a>
        <a href="/backup" class="nav-link" data-nav="backup">
          <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          <span>Sao lưu</span>
        </a>
        <a href="/settings" class="nav-link" data-nav="settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Cài đặt</span>
        </a>
      </nav>

      <div class="header-status">
        <span class="status-dot" aria-hidden="true"></span>
        <span>Local / Offline</span>
      </div>
    </header>

    <main class="main-content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script>
    (function() {
      const path = window.location.pathname;
      const links = document.querySelectorAll('.nav-link');
      links.forEach(link => {
        const target = link.getAttribute('href');
        if (target === '/' && path === '/') {
          link.classList.add('active');
        } else if (target !== '/' && (path === target || path.startsWith(target + '/'))) {
          link.classList.add('active');
        } else if ((path === '/manual' || path.startsWith('/manual-')) && target === '/add-document') {
          link.classList.add('active');
        }
      });
    })();
  </script>
</body>
</html>
